<div class="smart-prioritization-container">
    <!-- Header -->
    <div class="table-header">
        <div class="search-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 0 1114 0z" />
            </svg>
            <input type="text" class="search-input" placeholder="Cari mesin..." />
        </div>
        <div class="line-filter">
            <button class="line-btn active">Semua Lini</button>
            <button class="line-btn">Lini A</button>
            <button class="line-btn">Lini B</button>
            <button class="line-btn">Lini C</button>
            <button class="line-btn">Status: Semua</button>
            <button class="add-btn" (click)="openAddDialog()">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span>Tambah Mesin</span>
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
        <table class="smart-table">
            <thead>
                <tr>
                    <th>Mesin</th>
                    <th>Lini</th>
                    <th>AHS</th>
                    <th>Status</th>
                    <th>Inspeksi Terakhir</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody>
                @for (machine of machineDetails(); track machine.id) {
                <tr>
                    <td>{{ machine.machineName }}</td>
                    <td>{{ machine.location }}</td>
                    <td>{{ machine.ahs }}</td>
                    <td>
                        <!-- Update bagian ini: tambahkan span badge dan ngClass -->
                        <span class="status-badge" [ngClass]="{
                                'status-routine': machine.statusName.toLowerCase() === 'routine',
                                'status-minor': machine.statusName.toLowerCase() === 'minor',
                                'status-major': machine.statusName.toLowerCase() === 'major',
                                'status-critical': machine.statusName.toLowerCase() === 'critical'
                              }">
                            {{ machine.statusName }}
                        </span>
                    </td>
                    <td>{{ machine.lastUpdate | date:'dd MMM yyyy' }}</td>
                    <td>
                        <button [routerLink]="['/add-machine', machine.id]" class="action-btn">
                            Detail
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
